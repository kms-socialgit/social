  segments.forEach(s=>{let lane=laneEnds.findIndex(end=>end<s.startCol);if(lane<0)lane=laneEnds.length;laneEnds[lane]=s.endCol;s.lane=lane;});

function saveProjectMaterialData(id,values,uploads,removeIds=[]){

  if(values.documentUrl&&!url)return fail('http 또는 https 문서 주소를 입력해 주세요.');
  if(url&&!String(values.documentTitle||'').trim())return fail('URL 자료명을 입력해 주세요.');

// All editable HTML passes through a tag/attribute allowlist before display.
function sanitizeNoteHTML(value){
  const doc=new DOMParser().parseFromString(String(value||''),'text/html');
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','UL','OL','LI','BLOCKQUOTE','H3','A']);
  const forbidden=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','TEMPLATE','LINK','META','IMG','VIDEO','AUDIO','NOSCRIPT']);
  const walk=node=>{
    if(node.nodeType===3)return esc(node.textContent);
    if(node.nodeType!==1||forbidden.has(node.tagName))return '';
    const children=Array.from(node.childNodes).map(walk).join('');
    if(!allowed.has(node.tagName))return children;
    const tagName=node.tagName.toLowerCase();if(tagName==='br')return '<br>';
    if(tagName==='a'){const href=safeHttpUrl(node.getAttribute('href'));return href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${children}</a>`:children;}
    return `<${tagName}>${children}</${tagName}>`;
  };
  return Array.from(doc.body.childNodes).map(walk).join('');
}
function notePlainText(html){
  const withBreaks=String(html||'').replace(/<\/(p|div|li|h3|blockquote)>|<br\s*\/?\s*>/gi,' ');
  return new DOMParser().parseFromString(withBreaks,'text/html').body.textContent.replace(/\s+/g,' ').trim();
}

    if(act==='project-file'){openDialog('횡전개 첨부 자료','<p>대표 사진, 설치 가이드, 체크리스트를 이 영역에서 미리 보거나 내려받는 구성입니다.</p><div class="ops-notice">현재 화면의 파일명과 자료는 시안용 예시입니다.</div>',action('닫기','data-action="close-modal"'));return;}
    if(act==='new-project'){openNewEntity('rollout');return;}
    if(act==='new-sop'){openDialog('SOP 등록',`<form id="ops-sop-form" data-form="sop"><div class="ops-form-grid"><div class="ops-field full"><label for="ops-new-sop-name">문서명</label><input id="ops-new-sop-name" class="ops-input" name="name" placeholder="LINE_설비_작업_내용_v1.0.pdf" required></div><div class="ops-field"><label for="ops-new-sop-line">LINE</label><select id="ops-new-sop-line" class="ops-select" name="line">${Object.keys(lines).map(l=>`<option>${l}</option>`).join('')}<option>공통</option></select></div><div class="ops-field"><label for="ops-new-sop-work">작업 유형</label><select id="ops-new-sop-work" class="ops-select" name="work"><option>PM</option><option>BM</option><option>개조</option><option>비산정</option></select></div><div class="ops-field full"><label for="ops-new-sop-url">문서 URL</label><input id="ops-new-sop-url" class="ops-input" type="url" name="url" placeholder="https://사내문서주소"></div><div class="ops-field full"><label for="ops-new-sop-file">파일 첨부</label><input id="ops-new-sop-file" class="ops-input" type="file" name="file"><span class="ops-note">시안에서는 파일을 업로드하지 않습니다.</span></div></div></form>`,action('취소','data-action="close-modal"')+'<button type="submit" form="ops-sop-form" class="ops-action ops-action-primary">목록에 추가</button>');}
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.hasAttribute('data-asset-kind')){previewSelectedImages(el);return;}
    if(el.hasAttribute('data-demo-role')){if(!['user','admin','master'].includes(el.value))return;state.role=el.value;state.homeLine=state.role==='master'?'all':state.userLine;if(!modal.hidden)closeDialog();renderMain();if(state.dock)renderDock();const count=allApprovals().filter(a=>a.status==='pending'&&canApprove(a)).length;if(state.role==='master'&&count)toast('전체 라인 결재 대기 '+count+'건이 있습니다.');return;}
    if(el.hasAttribute('data-work-start-date')){const form=el.closest('form');form.elements.endDate.min=el.value;if(form.elements.endDate.value<el.value)form.elements.endDate.value=el.value;}
    if(el.hasAttribute('data-work-eqp'))updateWorkForm();
    if(el.dataset.filter){state.equipmentPage=1;state[el.dataset.filter]=el.value;if(el.dataset.filter==='line')state.sdwt='all';state.tablePage=1;renderMain();}
    if(el.hasAttribute('data-status-filter')){setRolloutFilter(el.value);}
    if(el.hasAttribute('data-approval-type')){state.approvalType=el.value;renderMain();}
    if(el.hasAttribute('data-sop-work')){state.sopWork=el.value;renderMain();}
    if(el.hasAttribute('data-dependent-line')){const select=main.querySelector('[data-dependent-sdwt]');select.disabled=!el.value;select.innerHTML=el.value?lines[el.value].map(x=>`<option>${x}</option>`).join(''):'<option value="">LINE을 먼저 선택</option>';}
    if(el.hasAttribute('data-request-role')){main.querySelector('[data-permission-routing]').textContent=el.value==='master'?'master 권한 신청은 master만 결재할 수 있습니다.':'신청 LINE의 admin 또는 master가 검토합니다.';}
    if(el.hasAttribute('data-work-line')){modal.querySelector('[name="sn"]').innerHTML=eqps.filter(x=>x.line===el.value).map(x=>`<option value="${x.sn}">${x.eqp} · ${x.sdwt} · ${x.unit}</option>`).join('');updateWorkForm();}
    if(el.hasAttribute('data-work-type'))updateWorkForm();
  });
  root.addEventListener('input',e=>{
    const el=e.target;
    const restore=(selector,value)=>{renderMain();const n=main.querySelector(selector);n.focus();n.setSelectionRange(value.length,value.length);};
    if(el.hasAttribute('data-eq-search')){state.equipmentPage=1;state.eq=el.value;state.tablePage=1;restore('[data-eq-search]',state.eq);}
    if(el.hasAttribute('data-sop-query')){state.sopQuery=el.value;restore('[data-sop-query]',state.sopQuery);}
  });
  root.addEventListener('submit',e=>{
    const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=new FormData(form);
    if(form.dataset.form==='project-materials'){saveProjectMaterials(form,data);return;}
    if(form.dataset.form==='hold-note'){saveHoldNote(form);return;}
    if(form.dataset.form==='qcode'){state.qcode=String(data.get('qcode')).trim().toUpperCase();renderMain();}
    if(form.dataset.form==='chat'){const text=String(data.get('message')).trim();if(!text)return;messages.push({id:Date.now(),who:'김민수',mine:true,time:'14:20',text});renderDock();dock.querySelector('textarea')?.focus();}
    if(form.dataset.form==='ai'){const text=String(data.get('message')).trim();if(text)askAi(text);}
    if(form.dataset.form==='edit-message'){const msg=messages.find(m=>m.id===Number(form.dataset.id)&&m.mine),text=String(data.get('message')).trim();if(!msg||!text)return;msg.text=text;msg.edited=true;closeDialog();renderDock();}
    if(form.dataset.form==='permission'){submitPermissionRequest(data);}
    if(form.dataset.form==='work'){submitWorkForm(form,data);}
    if(form.dataset.form==='sop'){sops.unshift({id:Date.now(),name:data.get('name'),line:data.get('line'),work:data.get('work'),desc:'새로 등록한 SOP · 예시',rev:'v1.0',date:'2026.09.14',owner:'김민수'});closeDialog();renderMain();toast('SOP 목록에 예시 항목을 추가했습니다.');}
  });
  root.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!modal.hidden){closeDialog();return;}
    if(e.key==='Tab'&&!modal.hidden){const f=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[contenteditable="true"],a[href]')].filter(x=>x.getClientRects().length);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='ops-message-input'){e.preventDefault();e.target.closest('form').requestSubmit();}
  });
  root.addEventListener('mousedown',e=>{if(e.target.closest('[data-note-format]'))e.preventDefault();});
  root.addEventListener('paste',e=>{
    if(!e.target.closest('#ops-hold-editor'))return;
    e.preventDefault();
    const source=e.clipboardData?.getData('text/html'),plain=e.clipboardData?.getData('text/plain')||'';
    document.execCommand('insertHTML',false,sanitizeNoteHTML(source||esc(plain).replace(/\n/g,'<br>')));
  });
  root.addEventListener('drop',e=>{if(e.target.closest('#ops-hold-editor')){e.preventDefault();toast('본문에는 텍스트를 붙여넣어 주세요. 이미지는 과제 자료에서 첨부할 수 있습니다.');}});
  modal.addEventListener('click',e=>{if(e.target===modal)closeDialog();});
  initStickyNavigation();
  window.addEventListener('load',paintIcons,{once:true});
  renderMain();
})();
</script>

</body>
</html>
