<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="설비 통합 관제 프론트엔드 시안 · 횡전개, 작업 캘린더, 부품, SOP, 결재, 채팅">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://unpkg.com; style-src 'unsafe-inline'; img-src data: blob:; font-src 'none'; connect-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'">
<title>설비 통합 관제 · 화면 시안 v3</title>
<script src="https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js" defer></script>
</head>
<body>
<div id="equipment-ops-preview">
  <div class="ops-window">
    <header class="ops-topbar">
      <div class="ops-brand"><span class="ops-mark"><i data-lucide="panels-top-left" aria-hidden="true"></i></span><div><strong>설비 통합 관제</strong><span>Equipment Operations</span></div></div>
      <div class="ops-preview-label"><span></span>화면 시안 v3 · 예시 데이터</div>
      <div class="ops-profile"><span class="ops-avatar">민</span><div><strong>김민수 <span class="ops-role" data-current-role>admin</span></strong><span>LINE-A · DIFF · 설비기술팀</span></div><label class="ops-role-switch">예시 권한<select class="ops-role-select" data-demo-role aria-label="시안 권한 선택"><option value="user">user</option><option value="admin" selected>admin</option><option value="master">master</option></select></label></div>
    </header>
    <div class="ops-navigation">
      <nav class="ops-pages" aria-label="업무 메뉴">
        <button type="button" data-page="rollout" class="ops-nav is-active"><i data-lucide="layout-dashboard" aria-hidden="true"></i>횡전개</button>
        <button type="button" data-page="calendar" class="ops-nav"><i data-lucide="calendar-days" aria-hidden="true"></i>작업 캘린더</button>
        <button type="button" data-page="parts" class="ops-nav"><i data-lucide="package" aria-hidden="true"></i>부품 현황</button>
        <button type="button" data-page="sop" class="ops-nav"><i data-lucide="files" aria-hidden="true"></i>SOP 모음</button>
        <button type="button" data-page="approvals" class="ops-nav"><i data-lucide="inbox" aria-hidden="true"></i>결재함 <span data-approval-count class="ops-count">(3)</span></button>
        <button type="button" data-page="permission" class="ops-nav"><i data-lucide="user-round-check" aria-hidden="true"></i>권한 신청</button>
      </nav>
      <div class="ops-utilities">
        <button type="button" data-dock="chat" class="ops-utility" aria-expanded="false" aria-controls="ops-dock"><i data-lucide="messages-square" aria-hidden="true"></i>채팅 <span data-chat-count class="ops-count">(2)</span></button>
        <button type="button" data-dock="ai" class="ops-utility" aria-expanded="false" aria-controls="ops-dock"><i data-lucide="sparkles" aria-hidden="true"></i>AI</button>
      </div>
    </div>
    <div class="ops-workarea">
      <main id="ops-main" class="ops-main" aria-label="업무 화면"></main>
      <aside id="ops-dock" class="ops-dock" aria-label="대화 패널" hidden></aside>
    </div>
    <div id="ops-modal" class="ops-modal" hidden></div>
    <div id="ops-toast" class="ops-toast" role="status" hidden></div>
  </div>
</div>
<style>
#equipment-ops-preview{
 --ops-ground:light-dark(#f3f5f9,#121823);--ops-surface:light-dark(#ffffff,#1b2330);--ops-soft:light-dark(#f7f9fc,#222c3a);--ops-ink:light-dark(#182941,#e5eaf2);--ops-muted:light-dark(#65748a,#a9b7ca);--ops-line:light-dark(#e2e8f0,#354152);--ops-blue:light-dark(#2b5fe5,#88adff);--ops-blue-soft:light-dark(#edf3ff,#263c60);--ops-green:light-dark(#187952,#81d3b0);--ops-green-soft:light-dark(#ebf7f0,#203d35);--ops-amber:light-dark(#996410,#ecc17d);--ops-amber-soft:light-dark(#fff5df,#463a23);--ops-red:light-dark(#b74b43,#f5a198);--ops-red-soft:light-dark(#fcefed,#472b2d);--ops-purple:light-dark(#7860b3,#beabed);--ops-purple-soft:light-dark(#f3effb,#382f4d);--ops-on-blue:light-dark(#fff,#14223a);--ops-shadow:light-dark(#16325b18,#00000040);
 color:var(--ops-ink);font-family:Inter,"Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;width:100%;background:transparent;
}
#equipment-ops-preview *{box-sizing:border-box}
#equipment-ops-preview [hidden]{display:none!important}
#equipment-ops-preview button,#equipment-ops-preview input,#equipment-ops-preview select,#equipment-ops-preview textarea{font:inherit;color:inherit}
#equipment-ops-preview button{cursor:pointer}
#equipment-ops-preview button:disabled{cursor:default;opacity:.5}
#equipment-ops-preview button:focus-visible,#equipment-ops-preview input:focus-visible,#equipment-ops-preview select:focus-visible,#equipment-ops-preview textarea:focus-visible{outline:2px solid var(--ops-blue);outline-offset:3px}
#equipment-ops-preview button svg,#equipment-ops-preview i[data-lucide]{width:16px;height:16px;flex-shrink:0}
#equipment-ops-preview h1,#equipment-ops-preview h2,#equipment-ops-preview h3,#equipment-ops-preview p{margin:0}
#equipment-ops-preview strong,#equipment-ops-preview h1,#equipment-ops-preview h2,#equipment-ops-preview h3{font-weight:600}
#equipment-ops-preview .ops-window{position:relative;overflow:hidden;border:1px solid var(--ops-line);border-radius:14px;background:var(--ops-ground)}
#equipment-ops-preview .ops-topbar{display:flex;align-items:center;gap:22px;padding:20px 24px;background:var(--ops-surface);flex-wrap:wrap}
#equipment-ops-preview .ops-brand{display:flex;align-items:center;gap:11px;margin-right:auto}

#equipment-ops-preview .ops-brand strong{display:block;font-size:18px;letter-spacing:-.6px}

#equipment-ops-preview .ops-avatar{display:inline-grid;place-items:center;background:var(--ops-blue-soft);color:var(--ops-blue);width:34px;height:34px;border-radius:50%;font-size:13px;font-weight:600;flex-shrink:0}
#equipment-ops-preview .ops-role{margin-left:4px;background:var(--ops-soft);border:1px solid var(--ops-line);padding:1px 5px;border-radius:4px;color:var(--ops-muted);font-size:11px}
#equipment-ops-preview .ops-navigation{display:flex;align-items:stretch;padding:0 16px;gap:12px;border-top:1px solid var(--ops-line);border-bottom:1px solid var(--ops-line);background:var(--ops-surface);flex-wrap:wrap}

#equipment-ops-preview .ops-nav{display:flex;align-items:center;justify-content:center;gap:6px;border:0;border-bottom:2px solid transparent;background:transparent;min-height:52px;padding:0 10px;color:var(--ops-muted);font-size:12px;white-space:nowrap}

#equipment-ops-preview .ops-count{color:var(--ops-blue);font-size:11px;font-weight:600}
#equipment-ops-preview .ops-workarea{display:flex;align-items:stretch;min-height:760px}
#equipment-ops-preview .ops-main{flex:1;min-width:0;padding:24px;container-type:inline-size;container-name:ops-content}

#equipment-ops-preview .ops-icon-action:hover{background:var(--ops-soft);color:var(--ops-blue)}
#equipment-ops-preview .ops-filterbar{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--ops-surface);border:1px solid var(--ops-line);border-radius:9px;flex-wrap:wrap;margin-bottom:18px}

#equipment-ops-preview .ops-surface{border:1px solid var(--ops-line);border-radius:10px;background:var(--ops-surface);overflow:hidden}
#equipment-ops-preview .ops-section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:17px 18px;border-bottom:1px solid var(--ops-line)}
#equipment-ops-preview .ops-section-head h2{font-size:14px;letter-spacing:-.2px}
#equipment-ops-preview .ops-note{color:var(--ops-muted);font-size:11px}
#equipment-ops-preview .ops-flex{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#equipment-ops-preview .ops-spread{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

function safeHttpUrl(value){
  const text=String(value||'').trim();
  if(!/^https?:\/\//i.test(text))return '';

}

// All editable HTML passes through a tag/attribute allowlist before display.
function sanitizeNoteHTML(value){
  const doc=new DOMParser().parseFromString(String(value||''),'text/html');
  const allowed=new Set(['P','DIV','BR','STRONG','B','EM','I','U','UL','OL','LI','BLOCKQUOTE','H3','A']);
  const forbidden=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','SVG','MATH','FORM','INPUT','BUTTON','TEXTAREA','SELECT','TEMPLATE','LINK','META','IMG','VIDEO','AUDIO','NOSCRIPT']);
  const walk=node=>{
    if(node.nodeType===3)return esc(node.textContent);
    if(node.nodeType!==1||forbidden.has(node.tagName))return '';
    const children=Array.from(node.childNodes).map(walk).join('');
    if(!allowed.has(node.tagName))return children;
    const tagName=node.tagName.toLowerCase();if(tagName==='br')return '<br>';
    if(tagName==='a'){const href=safeHttpUrl(node.getAttribute('href'));return href?`<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${children}</a>`:children;}
    return `<${tagName}>${children}</${tagName}>`;
  };
  return Array.from(doc.body.childNodes).map(walk).join('');
}
function notePlainText(html){
  const withBreaks=String(html||'').replace(/<\/(p|div|li|h3|blockquote)>|<br\s*\/?\s*>/gi,' ');
  return new DOMParser().parseFromString(withBreaks,'text/html').body.textContent.replace(/\s+/g,' ').trim();
}

    if(act==='goto-approval'){closeDialog();state.page='approvals';state.approvalTab='todo';renderMain();return;}
    if(act==='my-requests'){state.page='approvals';state.approvalTab='mine';renderMain();return;}
    if(act==='project-file'){openDialog('횡전개 첨부 자료','<p>대표 사진, 설치 가이드, 체크리스트를 이 영역에서 미리 보거나 내려받는 구성입니다.</p><div class="ops-notice">현재 화면의 파일명과 자료는 시안용 예시입니다.</div>',action('닫기','data-action="close-modal"'));return;}
    if(act==='new-project'){openDialog('횡전개 항목 구성',`<div class="ops-form-grid"><div class="ops-field full"><label>항목명</label><input class="ops-input" placeholder="새 횡전개 항목명"></div><div class="ops-field"><label>카테고리</label><select class="ops-select"><option>HW</option><option>SW</option></select></div><div class="ops-field"><label>입력 양식</label><select class="ops-select"><option>체크리스트형</option><option>버전 배포형</option><option>단계별 진행형</option></select></div><div class="ops-field full"><label>대시보드 구성</label><select class="ops-select"><option>라인 진척률 + 설비 체크리스트</option><option>버전 분포 + 배포 결과</option><option>단계별 진척 + 설비 목록</option></select></div></div><div class="ops-notice">항목마다 입력 양식과 대시보드 구성을 선택하는 구조입니다.</div>`,action('구성 확인','data-action="close-modal"','ops-action-primary'));return;}
    if(act==='new-sop'){openDialog('SOP 등록',`<form id="ops-sop-form" data-form="sop"><div class="ops-form-grid"><div class="ops-field full"><label for="ops-new-sop-name">문서명</label><input id="ops-new-sop-name" class="ops-input" name="name" placeholder="LINE_설비_작업_내용_v1.0.pdf" required></div><div class="ops-field"><label for="ops-new-sop-line">LINE</label><select id="ops-new-sop-line" class="ops-select" name="line">${Object.keys(lines).map(l=>`<option>${l}</option>`).join('')}<option>공통</option></select></div><div class="ops-field"><label for="ops-new-sop-work">작업 유형</label><select id="ops-new-sop-work" class="ops-select" name="work"><option>PM</option><option>BM</option><option>개조</option><option>비산정</option></select></div><div class="ops-field full"><label for="ops-new-sop-url">문서 URL</label><input id="ops-new-sop-url" class="ops-input" type="url" name="url" placeholder="https://사내문서주소"></div><div class="ops-field full"><label for="ops-new-sop-file">파일 첨부</label><input id="ops-new-sop-file" class="ops-input" type="file" name="file"><span class="ops-note">시안에서는 파일을 업로드하지 않습니다.</span></div></div></form>`,action('취소','data-action="close-modal"')+'<button type="submit" form="ops-sop-form" class="ops-action ops-action-primary">목록에 추가</button>');}
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.hasAttribute('data-asset-kind')){previewSelectedImages(el);return;}
    if(el.hasAttribute('data-demo-role')){if(!['user','admin','master'].includes(el.value))return;state.role=el.value;if(!modal.hidden)closeDialog();renderMain();if(state.dock)renderDock();const count=allApprovals().filter(a=>a.status==='pending'&&canApprove(a)).length;if(state.role==='master'&&count)toast('전체 라인 결재 대기 '+count+'건이 있습니다.');return;}
    if(el.hasAttribute('data-work-start-date')){const form=el.closest('form');form.elements.endDate.min=el.value;if(form.elements.endDate.value<el.value)form.elements.endDate.value=el.value;}
    if(el.hasAttribute('data-work-eqp'))updateWorkForm();
    if(el.dataset.filter){state[el.dataset.filter]=el.value;if(el.dataset.filter==='line')state.sdwt='all';state.tablePage=1;renderMain();}
    if(el.hasAttribute('data-status-filter')){setRolloutFilter(el.value);}
    if(el.hasAttribute('data-approval-type')){state.approvalType=el.value;renderMain();}
    if(el.hasAttribute('data-sop-work')){state.sopWork=el.value;renderMain();}
    if(el.hasAttribute('data-dependent-line')){const select=main.querySelector('[data-dependent-sdwt]');select.disabled=!el.value;select.innerHTML=el.value?lines[el.value].map(x=>`<option>${x}</option>`).join(''):'<option value="">LINE을 먼저 선택</option>';}
    if(el.hasAttribute('data-request-role')){main.querySelector('[data-permission-routing]').textContent=el.value==='master'?'master 권한 신청은 master만 결재할 수 있습니다.':'신청 LINE의 admin 또는 master가 검토합니다.';}
    if(el.hasAttribute('data-work-line')){modal.querySelector('[name="sn"]').innerHTML=eqps.filter(x=>x.line===el.value).map(x=>`<option value="${x.sn}">${x.eqp} · ${x.sdwt} · ${x.unit}</option>`).join('');updateWorkForm();}
    if(el.hasAttribute('data-work-type'))updateWorkForm();
  });
  root.addEventListener('input',e=>{
    const el=e.target;
    const restore=(selector,value)=>{renderMain();const n=main.querySelector(selector);n.focus();n.setSelectionRange(value.length,value.length);};
    if(el.hasAttribute('data-eq-search')){state.eq=el.value;state.tablePage=1;restore('[data-eq-search]',state.eq);}
    if(el.hasAttribute('data-sop-query')){state.sopQuery=el.value;restore('[data-sop-query]',state.sopQuery);}
  });
  root.addEventListener('submit',e=>{
    const form=e.target;if(!form.dataset.form)return;e.preventDefault();const data=new FormData(form);
    if(form.dataset.form==='project-materials'){saveProjectMaterials(form,data);return;}
    if(form.dataset.form==='hold-note'){saveHoldNote(form);return;}
    if(form.dataset.form==='qcode'){state.qcode=String(data.get('qcode')).trim().toUpperCase();renderMain();}
    if(form.dataset.form==='chat'){const text=String(data.get('message')).trim();if(!text)return;messages.push({id:Date.now(),who:'김민수',mine:true,time:'14:20',text});renderDock();dock.querySelector('textarea')?.focus();}
    if(form.dataset.form==='ai'){const text=String(data.get('message')).trim();if(text)askAi(text);}
    if(form.dataset.form==='edit-message'){const msg=messages.find(m=>m.id===Number(form.dataset.id)&&m.mine),text=String(data.get('message')).trim();if(!msg||!text)return;msg.text=text;msg.edited=true;closeDialog();renderDock();}
    if(form.dataset.form==='permission'){submitPermissionRequest(data);}
    if(form.dataset.form==='work'){submitWorkForm(form,data);}
    if(form.dataset.form==='sop'){sops.unshift({id:Date.now(),name:data.get('name'),line:data.get('line'),work:data.get('work'),desc:'새로 등록한 SOP · 예시',rev:'v1.0',date:'2026.09.14',owner:'김민수'});closeDialog();renderMain();toast('SOP 목록에 예시 항목을 추가했습니다.');}
  });
  root.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!modal.hidden){closeDialog();return;}
    if(e.key==='Tab'&&!modal.hidden){const f=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[contenteditable="true"],a[href]')].filter(x=>x.getClientRects().length);if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='ops-message-input'){e.preventDefault();e.target.closest('form').requestSubmit();}
  });
  root.addEventListener('mousedown',e=>{if(e.target.closest('[data-note-format]'))e.preventDefault();});
  root.addEventListener('paste',e=>{
    if(!e.target.closest('#ops-hold-editor'))return;
    e.preventDefault();
    const source=e.clipboardData?.getData('text/html'),plain=e.clipboardData?.getData('text/plain')||'';
    document.execCommand('insertHTML',false,sanitizeNoteHTML(source||esc(plain).replace(/\n/g,'<br>')));
  });
  root.addEventListener('drop',e=>{if(e.target.closest('#ops-hold-editor')){e.preventDefault();toast('본문에는 텍스트를 붙여넣어 주세요. 이미지는 과제 자료에서 첨부할 수 있습니다.');}});
  modal.addEventListener('click',e=>{if(e.target===modal)closeDialog();});
  initStickyNavigation();
  window.addEventListener('load',paintIcons,{once:true});
  renderMain();
})();
</script>

</body>
</html>
